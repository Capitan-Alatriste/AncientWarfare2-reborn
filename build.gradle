plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = 'net.shadowmage.ancientwarfare'
version = '1.0.0-1.21.1'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)


neoForge {
    version = "21.1.84"
    mods {
        ancientwarfare {
            sourceSet project.sourceSets.main
        }
    }
    runs {
        configureEach {
            // modSource project.sourceSets.main
        }
        client {
            systemProperty 'neoforge.enabledGameTestNamespaces', 'ancientwarfare'
        }
        server {
            systemProperty 'neoforge.enabledGameTestNamespaces', 'ancientwarfare'
            programArgument '--nogui'
        }
        gameTestServer {
            systemProperty 'neoforge.enabledGameTestNamespaces', 'ancientwarfare'
        }
        data {
            programArguments.addAll '--mod', 'ancientwarfare', '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }
}

sourceSets.main.java.srcDirs = ['src/main/java']
sourceSets.main.resources.srcDirs = ['src/main/resources']

sourceSets.main.java.exclude 'net/shadowmage/ancientwarfare/core/block/**/*.java'
sourceSets.main.java.exclude 'net/shadowmage/ancientwarfare/core/command/**/*.java'
sourceSets.main.java.exclude 'net/shadowmage/ancientwarfare/core/compat/**/*.java'
sourceSets.main.java.exclude 'net/shadowmage/ancientwarfare/core/container/**/*.java'
sourceSets.main.java.exclude 'net/shadowmage/ancientwarfare/core/crafting/**/*.java'
sourceSets.main.java.exclude 'net/shadowmage/ancientwarfare/core/gui/**/*.java'
sourceSets.main.java.exclude 'net/shadowmage/ancientwarfare/core/init/**/*.java'
sourceSets.main.java.exclude 'net/shadowmage/ancientwarfare/core/input/**/*.java'
// sourceSets.main.java.exclude 'net/shadowmage/ancientwarfare/core/interfaces/**/*.java'
sourceSets.main.java.exclude 'net/shadowmage/ancientwarfare/core/inventory/**/*.java'
sourceSets.main.java.exclude 'net/shadowmage/ancientwarfare/core/item/**/*.java'
sourceSets.main.java.exclude 'net/shadowmage/ancientwarfare/core/manual/**/*.java'
sourceSets.main.java.exclude 'net/shadowmage/ancientwarfare/core/network/**/*.java'
sourceSets.main.java.exclude 'net/shadowmage/ancientwarfare/core/proxy/**/*.java'
sourceSets.main.java.exclude 'net/shadowmage/ancientwarfare/core/registry/**/*.java'
sourceSets.main.java.exclude 'net/shadowmage/ancientwarfare/core/render/**/*.java'
sourceSets.main.java.exclude 'net/shadowmage/ancientwarfare/core/research/**/*.java'
sourceSets.main.java.exclude 'net/shadowmage/ancientwarfare/core/tile/**/*.java'
// sourceSets.main.java.exclude 'net/shadowmage/ancientwarfare/core/util/**/*.java'
sourceSets.main.java.exclude 'net/shadowmage/ancientwarfare/core/AWCoreTab.java'
sourceSets.main.java.exclude 'net/shadowmage/ancientwarfare/core/AncientWarfareCore.java'
sourceSets.main.java.exclude 'net/shadowmage/ancientwarfare/automation/**/*.java'
sourceSets.main.java.exclude 'net/shadowmage/ancientwarfare/npc/**/*.java'
sourceSets.main.java.exclude 'net/shadowmage/ancientwarfare/structure/**/*.java'
sourceSets.main.java.exclude 'net/shadowmage/ancientwarfare/vehicle/**/*.java'
sourceSets.main.java.exclude 'net/shadowmage/ancientwarfare/model/**/*.java'

repositories {
    mavenCentral()
}

dependencies {
    // neoForge version is configured in neoForge block
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
